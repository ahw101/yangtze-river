<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Dashboard - Bookings & Drinks</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    /* Hide scrollbar for a cleaner look while keeping functionality */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-12 antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">
          Management Dashboard
        </h1>
        <p class="text-sm text-gray-500 mt-0.5">Live data sync</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="fetchAllData()" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 border border-gray-300 rounded-lg shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Refresh Data
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    
    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-200 mb-8 gap-6">
      <button id="tab-bookings-btn" onclick="switchTab('bookings')" class="pb-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600 transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        Active Bookings <span id="bookings-count" class="ml-1 bg-blue-100 text-blue-700 py-0.5 px-2 rounded-full text-xs">0</span>
      </button>
      <button id="tab-drinks-btn" onclick="switchTab('drinks')" class="pb-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
        </svg>
        Drinks <span id="drinks-count" class="ml-1 bg-gray-100 text-gray-600 py-0.5 px-2 rounded-full text-xs">0</span>
      </button>
    </div>

    <!-- Status Message -->
    <div id="status-msg" class="hidden mb-6 p-4 rounded-lg text-sm font-medium border"></div>

    <!-- Bookings View -->
    <section id="section-bookings" class="space-y-4">
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wider border-b border-gray-200">
                <th class="py-3 px-6">ID</th>
                <th class="py-3 px-6">Guest Name</th>
                <th class="py-3 px-6">Check In</th>
                <th class="py-3 px-6">Check Out</th>
              </tr>
            </thead>
            <tbody id="bookings-tbody" class="divide-y divide-gray-100 text-sm">
              <tr><td colspan="4" class="py-12 text-center text-gray-400">Loading bookings...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Drinks View -->
    <section id="section-drinks" class="hidden space-y-4">
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wider border-b border-gray-200">
                <th class="py-3 px-6">Drink Item</th>
                <th class="py-3 px-6">Ordered By</th>
                <th class="py-3 px-6">Time Ordered</th>
                <th class="py-3 px-6">Order ID</th>
              </tr>
            </thead>
            <tbody id="drinks-tbody" class="divide-y divide-gray-100 text-sm">
              <tr><td colspan="4" class="py-12 text-center text-gray-400">Loading drinks...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://cjnccuhndzxprjyuawjr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_64EzKYsi__8oT4h4EJHP7A_iLnkJlla';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Parse Date and Time safely into a real Javascript Date object
    // Handles formats: YYYY-MM-DD, DD/MM/YYYY, D/M/YYYY and times like 8:00, 8:0
    function parseDateTime(dateStr, timeStr) {
      if (!dateStr) return null;
      let year, month, day;
      let cleanDate = dateStr.trim();
      
      if (cleanDate.includes('/')) {
        const parts = cleanDate.split('/');
        day = parseInt(parts[0], 10);
        month = parseInt(parts[1], 10) - 1; // JS Months are 0-indexed
        year = parseInt(parts[2], 10);
        if (year < 100) year += 2000; // Just in case year is '26' instead of '2026'
      } else if (cleanDate.includes('-')) {
        const parts = cleanDate.split('-');
        year = parseInt(parts[0], 10);
        month = parseInt(parts[1], 10) - 1;
        day = parseInt(parts[2], 10);
      } else {
        return null;
      }

      let hours = 0, minutes = 0;
      if (timeStr) {
        const cleanTime = timeStr.trim();
        const tParts = cleanTime.split(':');
        hours = parseInt(tParts[0], 10) || 0;
        let mStr = tParts[1] || '00';
        if (mStr.length === 1) mStr += '0'; // Fixes "8:0" to "8:00"
        minutes = parseInt(mStr, 10) || 0;
      }

      return new Date(year, month, day, hours, minutes);
    }

    // Format JS Date to strict DD/MM/YYYY
    function formatToDDMMYYYY(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return 'N/A';
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const y = dateObj.getFullYear();
      return `${d}/${m}/${y}`;
    }

    // Format JS Date to HH:MM
    function formatToHHMM(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return '00:00';
      const h = String(dateObj.getHours()).padStart(2, '0');
      const m = String(dateObj.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    // Format Drinks Timestamp
    function formatTimestamp(isoString) {
      if (!isoString) return 'N/A';
      const date = new Date(isoString);
      if (isNaN(date.getTime())) return isoString;

      return new Intl.DateTimeFormat('en-GB', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      }).format(date);
    }

    // Fetch and Display Data
    async function fetchAllData() {
      showStatus('Syncing latest data...', 'info');

      try {
        // Fetch Bookings
        const { data: bookings, error: bookingsErr } = await supabaseClient
          .from('Bookings')
          .select('*')
          .order('id', { ascending: false });

        if (bookingsErr) throw bookingsErr;

        // Fetch Drinks
        const { data: drinks, error: drinksErr } = await supabaseClient
          .from('Drinks')
          .select('*')
          .order('created_at', { ascending: false });

        if (drinksErr) throw drinksErr;

        renderBookings(bookings || []);
        renderDrinks(drinks || []);
        
        hideStatus();
      } catch (err) {
        console.error('Data Fetch Error:', err);
        showStatus('Failed to load data from Supabase. Check console for details.', 'error');
      }
    }

    function renderBookings(allBookings) {
      const now = new Date();
      
      // Filter out bookings where check-out time is in the past (hides them)
      const activeBookings = allBookings.filter(item => {
        const checkoutObj = parseDateTime(item.end_date, item.end_time);
        if (!checkoutObj) return true; // Keep if we can't parse it
        return checkoutObj >= now; // Only keep if checkout is in the future
      });

      document.getElementById('bookings-count').textContent = activeBookings.length;
      const tbody = document.getElementById('bookings-tbody');

      if (activeBookings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-12 text-center text-gray-500">No active bookings found.</td></tr>`;
        return;
      }

      tbody.innerHTML = activeBookings.map(item => {
        const checkInObj = parseDateTime(item.Date, item.Time);
        const checkOutObj = parseDateTime(item.end_date, item.end_time);

        const checkInDateStr = formatToDDMMYYYY(checkInObj);
        const checkInTimeStr = formatToHHMM(checkInObj);
        
        const checkOutDateStr = formatToDDMMYYYY(checkOutObj);
        const checkOutTimeStr = formatToHHMM(checkOutObj);

        return `
          <tr class="hover:bg-gray-50/80 transition-colors">
            <td class="py-4 px-6 font-mono text-xs text-gray-400">#${item.id}</td>
            <td class="py-4 px-6 font-medium text-gray-900 capitalize">${item.name || 'Unnamed'}</td>
            <td class="py-4 px-6">
              <div class="flex flex-col">
                <span class="text-sm text-gray-800">${checkInDateStr}</span>
                <span class="text-xs text-gray-500">${checkInTimeStr}</span>
              </div>
            </td>
            <td class="py-4 px-6">
              <div class="flex flex-col">
                <span class="text-sm text-gray-800">${checkOutDateStr}</span>
                <span class="text-xs text-gray-500">${checkOutTimeStr}</span>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderDrinks(drinks) {
      document.getElementById('drinks-count').textContent = drinks.length;
      const tbody = document.getElementById('drinks-tbody');

      if (drinks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-12 text-center text-gray-500">No drinks logged yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = drinks.map(item => {
        const formattedDrink = (item.drink || 'Unknown').trim();
        const formattedTime = formatTimestamp(item.created_at);

        return `
          <tr class="hover:bg-gray-50/80 transition-colors">
            <td class="py-4 px-6">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-sm">
                  🍹
                </div>
                <span class="font-medium text-gray-900">${formattedDrink}</span>
              </div>
            </td>
            <td class="py-4 px-6 text-gray-700 capitalize">${item.person || 'Unknown'}</td>
            <td class="py-4 px-6 text-gray-500 text-sm">${formattedTime}</td>
            <td class="py-4 px-6 font-mono text-xs text-gray-400">#${item.id}</td>
          </tr>
        `;
      }).join('');
    }

    // UI Helpers
    function switchTab(tab) {
      const bookingsSec = document.getElementById('section-bookings');
      const drinksSec = document.getElementById('section-drinks');
      const bookingsBtn = document.getElementById('tab-bookings-btn');
      const drinksBtn = document.getElementById('tab-drinks-btn');

      if (tab === 'bookings') {
        bookingsSec.classList.remove('hidden');
        drinksSec.classList.add('hidden');
        
        bookingsBtn.className = "pb-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600 transition-colors flex items-center gap-2";
        drinksBtn.className = "pb-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors flex items-center gap-2";
      } else {
        bookingsSec.classList.add('hidden');
        drinksSec.classList.remove('hidden');
        
        drinksBtn.className = "pb-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600 transition-colors flex items-center gap-2";
        bookingsBtn.className = "pb-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors flex items-center gap-2";
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-blue-50', 'border-blue-200', 'text-blue-700');
      if (type === 'error') {
        el.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
      } else {
        el.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-700');
      }
      el.textContent = msg;
    }

    function hideStatus() {
      document.getElementById('status-msg').classList.add('hidden');
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', fetchAllData);
  </script>
</body>
</html>
